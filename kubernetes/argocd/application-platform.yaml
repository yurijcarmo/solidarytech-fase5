apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-platform
  namespace: argocd
  labels:
    team: solidarytech
    cost-center: ngo-core
spec:
  project: solidarytech
  source:
    repoURL: https://github.com/CHANGE_ME/solidarytech.git
    targetRevision: main
    path: kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: solidarytech
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
