apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-receiver-script
  namespace: monitoring
  labels:
    app: incident-receiver
    team: solidarytech
data:
  receiver.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length)

            try:
                payload = json.loads(body)
                print("=== ALERTMANAGER EVENT ===", flush=True)
                print(json.dumps(payload, indent=2), flush=True)
            except json.JSONDecodeError:
                print("=== INVALID ALERTMANAGER PAYLOAD ===", flush=True)
                print(body.decode(errors="replace"), flush=True)

            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(b'{"status":"ok"}')

        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(
                    b'{"status":"healthy","service":"incident-receiver"}'
                )
                return

            self.send_response(404)
            self.end_headers()

        def log_message(self, format, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-receiver
  namespace: monitoring
  labels:
    app: incident-receiver
    team: solidarytech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-receiver
  template:
    metadata:
      labels:
        app: incident-receiver
        team: solidarytech
    spec:
      containers:
        - name: incident-receiver
          image: python:3.13-slim
          command:
            - python
            - /app/receiver.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: receiver-script
              mountPath: /app
              readOnly: true
      volumes:
        - name: receiver-script
          configMap:
            name: incident-receiver-script
---
apiVersion: v1
kind: Service
metadata:
  name: incident-receiver
  namespace: monitoring
  labels:
    app: incident-receiver
    team: solidarytech
spec:
  type: ClusterIP
  selector:
    app: incident-receiver
  ports:
    - name: webhook
      port: 8080
      targetPort: 8080
      protocol: TCP
