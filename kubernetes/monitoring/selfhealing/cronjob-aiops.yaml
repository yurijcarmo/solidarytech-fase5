apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-remediation
  namespace: monitoring
  labels:
    app: aiops-remediation
    team: solidarytech
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: aiops-remediation
        spec:
          serviceAccountName: prometheus
          restartPolicy: Never
          containers:
            - name: aiops
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  NAMESPACE="solidarytech"
                  MONITORING_NS="monitoring"
                  FIXES=0

                  echo "[AIOPS $(date +'%H:%M:%S')] Verificacao proativa iniciada"

                  # 1. Pods CrashLoopBackOff
                  for pod in $(kubectl get pods -n $NAMESPACE --no-headers \
                    -o custom-columns="NAME:.metadata.name,REASON:.status.containerStatuses[0].state.waiting.reason" 2>/dev/null \
                    | grep "CrashLoopBackOff" | awk '{print $1}'); do
                    deploy=$(echo "$pod" | sed 's/-[a-f0-9]*-[a-z0-9]*$//')
                    echo "[FIXED] CrashLoopBackOff $pod — restart $deploy"
                    kubectl rollout restart deployment/$deploy -n $NAMESPACE 2>/dev/null
                    FIXES=$((FIXES + 1))
                  done

                  # 2. Pods Pending por limite de capacidade
                  pending=$(kubectl get pods -n $NAMESPACE --no-headers --field-selector=status.phase=Pending 2>/dev/null | wc -l)
                  if [ "$pending" -gt 0 ]; then
                    total=$(kubectl get pods -A --no-headers 2>/dev/null | wc -l)
                    nodes=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
                    max=$((nodes * 17))
                    if [ "$total" -ge "$max" ]; then
                      echo "[ISSUE] $pending pods Pending — capacidade esgotada ($total/$max)"
                      for hpa in $(kubectl get hpa -n $NAMESPACE -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                        current=$(kubectl get hpa "$hpa" -n $NAMESPACE -o jsonpath='{.status.currentReplicas}' 2>/dev/null)
                        min=$(kubectl get hpa "$hpa" -n $NAMESPACE -o jsonpath='{.spec.minReplicas}' 2>/dev/null)
                        if [ "$current" -gt "$min" ] && [ "$current" -gt 2 ]; then
                          deploy=$(kubectl get hpa "$hpa" -n $NAMESPACE -o jsonpath='{.spec.scaleTargetRef.name}' 2>/dev/null)
                          target=$((current - 1))
                          kubectl scale deployment/$deploy -n $NAMESPACE --replicas=$target 2>/dev/null
                          echo "[FIXED] $deploy reduzido para $target replicas"
                          FIXES=$((FIXES + 1))
                        fi
                      done
                    fi
                  fi

                  # 3. Monitoring components down
                  for comp in prometheus alertmanager grafana loki; do
                    ready=$(kubectl get deployment $comp -n $MONITORING_NS \
                      -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
                    if [ "$ready" = "0" ] || [ -z "$ready" ]; then
                      echo "[FIXED] $comp nao pronto — reiniciando"
                      kubectl rollout restart deployment/$comp -n $MONITORING_NS 2>/dev/null
                      FIXES=$((FIXES + 1))
                    fi
                  done

                  # 4. Namespaces travados
                  for ns in $(kubectl get namespaces --no-headers 2>/dev/null | grep "Terminating" | awk '{print $1}'); do
                    echo "[FIXED] Namespace $ns travado — removendo finalizers"
                    kubectl get namespace $ns -o json 2>/dev/null | \
                      python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" 2>/dev/null | \
                      kubectl replace --raw /api/v1/namespaces/$ns/finalize -f - 2>/dev/null
                    FIXES=$((FIXES + 1))
                  done

                  echo "[AIOPS $(date +'%H:%M:%S')] Concluido — $FIXES correcoes aplicadas"
