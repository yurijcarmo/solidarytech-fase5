apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerting-rules
  namespace: monitoring
  labels:
    app: prometheus
    team: solidarytech
data:
  alerting-rules.yml: |
    groups:
      - name: solidarytech-slo
        rules:
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(donation_errors_total{job="donation-service"}[5m]))
                /
                sum(rate(donation_request_duration_seconds_count{job="donation-service"}[5m]))
              ) > 0.01
            for: 5m
            labels:
              severity: critical
              service: donation-service
              team: solidarytech
            annotations:
              summary: "Taxa de erros do donation-service acima de 1%"
              description: "Error rate atual: {{ $value | humanizePercentage }}. SLO target: 0.1%."
              runbook_url: "https://wiki.solidarytech.org/runbooks/high-error-rate"
              remediation: "auto-scalable"

          - alert: HighLatency
            expr: |
              histogram_quantile(0.99,
                sum(rate(donation_request_duration_seconds_bucket{job="donation-service"}[5m])) by (le)
              ) > 0.5
            for: 5m
            labels:
              severity: critical
              service: donation-service
              team: solidarytech
            annotations:
              summary: "Latencia p99 do donation-service acima de 500ms"
              description: "Latencia p99 atual: {{ $value }}s. SLO target: 0.5s."
              runbook_url: "https://wiki.solidarytech.org/runbooks/high-latency"

          - alert: SLOBudgetBurnRate
            expr: |
              (
                1 - (
                  sum(rate(donation_request_duration_seconds_count{job="donation-service", status!~"5.."}[1h]))
                  /
                  sum(rate(donation_request_duration_seconds_count{job="donation-service"}[1h]))
                )
              ) / 0.001 > 2
            for: 10m
            labels:
              severity: warning
              service: donation-service
              team: solidarytech
            annotations:
              summary: "Error budget burn rate acima de 2x"
              description: "Burn rate atual: {{ $value }}x."
              runbook_url: "https://wiki.solidarytech.org/runbooks/error-budget"

      - name: solidarytech-infrastructure
        rules:
          - alert: PodCrashLooping
            expr: |
              increase(kube_pod_container_status_restarts_total{namespace="solidarytech"}[10m]) > 3
            for: 1m
            labels:
              severity: critical
              team: solidarytech
            annotations:
              summary: "Pod {{ $labels.pod }} em CrashLoopBackOff"
              description: "Pod {{ $labels.pod }} reiniciou {{ $value }} vezes nos ultimos 10 min."
              remediation: "auto-restart"

          - alert: HighMemoryUsage
            expr: |
              (
                container_memory_working_set_bytes{namespace="solidarytech"}
                /
                container_spec_memory_limit_bytes{namespace="solidarytech"}
              ) > 0.85
            for: 5m
            labels:
              severity: warning
              team: solidarytech
            annotations:
              summary: "Pod {{ $labels.pod }} com uso de memoria acima de 85%"
              description: "Uso atual: {{ $value | humanizePercentage }} do limite."
              remediation: "auto-scalable"

          - alert: HighCPUUsage
            expr: |
              (
                sum(rate(container_cpu_usage_seconds_total{namespace="solidarytech"}[5m])) by (pod)
                /
                sum(container_spec_cpu_quota{namespace="solidarytech"} / container_spec_cpu_period{namespace="solidarytech"}) by (pod)
              ) > 0.85
            for: 5m
            labels:
              severity: warning
              team: solidarytech
            annotations:
              summary: "Pod {{ $labels.pod }} com uso de CPU acima de 85%"
              description: "Uso atual: {{ $value | humanizePercentage }} do limite."
              remediation: "auto-scalable"

          - alert: DonationQueueBacklog
            expr: |
              aws_sqs_approximate_number_of_messages_visible{queue_name="solidarytech-donations"} > 100
            for: 5m
            labels:
              severity: warning
              service: donation-worker
              team: solidarytech
            annotations:
              summary: "Fila de doacoes com mais de 100 mensagens pendentes"
              description: "Mensagens na fila: {{ $value }}. Possivel sobrecarga no worker."
              remediation: "auto-scale-worker"

          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{namespace="solidarytech", condition="true"} == 0
            for: 3m
            labels:
              severity: warning
              team: solidarytech
            annotations:
              summary: "Pod {{ $labels.pod }} nao esta ready"
              description: "O pod {{ $labels.pod }} esta em estado not-ready ha mais de 3 minutos."

          - alert: DeploymentReplicasMismatch
            expr: |
              kube_deployment_spec_replicas{namespace="solidarytech"}
              !=
              kube_deployment_status_ready_replicas{namespace="solidarytech"}
            for: 5m
            labels:
              severity: warning
              team: solidarytech
            annotations:
              summary: "Deployment {{ $labels.deployment }} com replicas incorretas"
              description: "Esperado: {{ $labels.spec_replicas }}. Pronto: {{ $value }}."
