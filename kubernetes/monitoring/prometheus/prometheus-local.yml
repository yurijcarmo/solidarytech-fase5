global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: ngo-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ngo-service:8080"]

  - job_name: donation-service
    metrics_path: /metrics
    static_configs:
      - targets: ["donation-service:8081"]

  - job_name: donation-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["donation-worker:8091"]

  - job_name: volunteer-service
    metrics_path: /metrics
    static_configs:
      - targets: ["volunteer-service:8082"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
