  business-donations.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": \"-- Grafana --\",\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"Metricas de Negocio - Doacoes, Moedas e Operacoes (SolidaryTech)\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 0,\n  \"id\": null,\n  \"links\": [],\n  \"panels\": [\n    {\n      \"title\": \"Doacoes Processadas (Total)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 0, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"blue\", \"value\": null } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"area\", \"orientation\": \"auto\" },\n      \"targets\": [\n        { \"expr\": \"donation_processed_total\", \"legendFormat\": \"Total\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Total Arrecadado (R$)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 5, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"currencyBRL\",\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"green\", \"value\": null }, { \"color\": \"dark-green\", \"value\": 10000 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"area\", \"orientation\": \"auto\" },\n      \"targets\": [\n        { \"expr\": \"donation_amount_brl_total\", \"legendFormat\": \"R$\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Taxa de Sucesso (%)\",\n      \"type\": \"gauge\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 10, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"red\", \"value\": null }, { \"color\": \"yellow\", \"value\": 90 }, { \"color\": \"green\", \"value\": 98 } ] }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(\\n  sum(donation_processed_total)\\n  /\\n  (sum(donation_processed_total) + (sum(donation_errors_total{error_type!=\\\"sqs_publish\\\"}) or vector(0)) + 1)\\n) * 100\",\n          \"legendFormat\": \"Success Rate\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Erros por Tipo\",\n      \"type\": \"piechart\",\n      \"gridPos\": { \"h\": 5, \"w\": 4, \"x\": 15, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" }\n        }\n      },\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"right\" }, \"pieType\": \"donut\", \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] } },\n      \"targets\": [\n        { \"expr\": \"donation_errors_total\", \"legendFormat\": \"{{ error_type }}\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Doacoes por Moeda\",\n      \"type\": \"piechart\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 19, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" }\n        }\n      },\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"right\" }, \"pieType\": \"donut\", \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] } },\n      \"targets\": [\n        { \"expr\": \"donation_by_currency_total\", \"legendFormat\": \"{{ currency }}\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Arrecadacao ao Longo do Tempo (R$)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 5 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"fixedColor\": \"dark-green\", \"mode\": \"fixed\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 30, \"lineWidth\": 2, \"showPoints\": \"never\" },\n          \"unit\": \"currencyBRL\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"donation_amount_brl_total\", \"legendFormat\": \"Total Acumulado (R$)\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Volume de Doacoes ao Longo do Tempo\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 5 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"fixedColor\": \"green\", \"mode\": \"fixed\" },\n          \"custom\": { \"drawStyle\": \"bars\", \"fillOpacity\": 60, \"lineWidth\": 1, \"showPoints\": \"never\" },\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"increase(donation_processed_total[5m])\", \"legendFormat\": \"Doacoes (5min)\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Doacoes por Moeda ao Longo do Tempo\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 13 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 30, \"lineWidth\": 2, \"showPoints\": \"never\", \"stacking\": { \"mode\": \"normal\" } },\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"increase(donation_by_currency_total[5m])\", \"legendFormat\": \"{{ currency }}\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Latencia de Processamento de Doacao\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 13 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 10, \"lineWidth\": 2, \"showPoints\": \"never\", \"thresholdsStyle\": { \"mode\": \"line+area\" } },\n          \"unit\": \"s\",\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"transparent\", \"value\": null }, { \"color\": \"red\", \"value\": 0.5 } ] }\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"histogram_quantile(0.50, sum(rate(donation_slo_latency_seconds_bucket[5m])) by (le))\", \"legendFormat\": \"P50\", \"refId\": \"A\" },\n        { \"expr\": \"histogram_quantile(0.95, sum(rate(donation_slo_latency_seconds_bucket[5m])) by (le))\", \"legendFormat\": \"P95\", \"refId\": \"B\" },\n        { \"expr\": \"histogram_quantile(0.99, sum(rate(donation_slo_latency_seconds_bucket[5m])) by (le))\", \"legendFormat\": \"P99\", \"refId\": \"C\" }\n      ]\n    },\n    {\n      \"title\": \"Erros ao Longo do Tempo (por tipo)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 8, \"x\": 0, \"y\": 21 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"bars\", \"fillOpacity\": 50, \"lineWidth\": 1, \"showPoints\": \"never\", \"stacking\": { \"mode\": \"normal\" } },\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"increase(donation_errors_total[5m])\", \"legendFormat\": \"{{ error_type }}\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Operacoes NGO Service\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 8, \"x\": 8, \"y\": 21 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 15, \"lineWidth\": 2, \"showPoints\": \"never\" },\n          \"unit\": \"ops\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"rate(ngo_operations_total[5m])\", \"legendFormat\": \"{{ operation }}\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Operacoes Volunteer Service\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 8, \"x\": 16, \"y\": 21 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 15, \"lineWidth\": 2, \"showPoints\": \"never\" },\n          \"unit\": \"ops\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"rate(volunteer_operations_total[5m])\", \"legendFormat\": \"{{ operation }}\", \"refId\": \"A\" }\n      ]\n    }\n  ],\n  \"refresh\": \"15s\",\n  \"schemaVersion\": 39,\n  \"tags\": [\"solidarytech\", \"business\", \"donations\"],\n  \"templating\": { \"list\": [] },\n  \"time\": { \"from\": \"now-3h\", \"to\": \"now\" },\n  \"timepicker\": {},\n  \"timezone\": \"browser\",\n  \"title\": \"Business Metrics - Doacoes e Operacoes\",\n  \"uid\": \"solidarytech-business-metrics\",\n  \"version\": 1\n}\n"
  dr-status.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": \"-- Grafana --\",\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"Disaster Recovery - Status, Failover, Integridade de Dados e Impacto (SolidaryTech)\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 0,\n  \"id\": null,\n  \"links\": [\n    { \"title\": \"Platform Overview\", \"url\": \"/d/solidarytech-platform-overview\", \"type\": \"link\" },\n    { \"title\": \"Business Metrics\", \"url\": \"/d/solidarytech-business-metrics\", \"type\": \"link\" }\n  ],\n  \"panels\": [\n    {\n      \"title\": \"DR & Failover\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Regiao Ativa\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 5, \"x\": 0, \"y\": 1 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"mappings\": [\n            { \"type\": \"range\", \"options\": { \"from\": 1, \"to\": 999, \"result\": { \"text\": \"us-east-1 (PROD)\", \"color\": \"green\" } } },\n            { \"type\": \"special\", \"options\": { \"match\": \"null\", \"result\": { \"text\": \"INDISPONIVEL\", \"color\": \"red\" } } }\n          ],\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"red\", \"value\": null }, { \"color\": \"green\", \"value\": 1 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"value\" },\n      \"targets\": [\n        { \"expr\": \"count(up{namespace=\\\"solidarytech\\\"} == 1)\", \"legendFormat\": \"\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Servicos UP\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 3, \"x\": 5, \"y\": 1 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"red\", \"value\": null }, { \"color\": \"yellow\", \"value\": 2 }, { \"color\": \"green\", \"value\": 3 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\" },\n      \"targets\": [\n        { \"expr\": \"count(up{namespace=\\\"solidarytech\\\"} == 1) or vector(0)\", \"legendFormat\": \"UP\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Servicos DOWN\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 3, \"x\": 8, \"y\": 1 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"green\", \"value\": null }, { \"color\": \"red\", \"value\": 1 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\" },\n      \"targets\": [\n        { \"expr\": \"count(up{namespace=\\\"solidarytech\\\"} == 0) or vector(0)\", \"legendFormat\": \"DOWN\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Uptime (24h)\",\n      \"type\": \"gauge\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 11, \"y\": 1 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"percentunit\",\n          \"min\": 0, \"max\": 1,\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"red\", \"value\": null }, { \"color\": \"yellow\", \"value\": 0.95 }, { \"color\": \"green\", \"value\": 0.999 } ] }\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"avg(avg_over_time(up{namespace=\\\"solidarytech\\\"}[24h]))\", \"legendFormat\": \"\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"RTO Atingido\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 15, \"y\": 1 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Recovery Time Objective: tempo entre producao cair e DR estar servindo. Target: 300s. Real: 58s. ATENCAO: durante estes 58s nao ha servico disponivel — transacoes neste intervalo sao perdidas.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"mappings\": [\n            { \"type\": \"range\", \"options\": { \"from\": 0, \"to\": 300, \"result\": { \"text\": \"58s / 300s\", \"color\": \"yellow\" } } }\n          ],\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"yellow\", \"value\": null } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"value\" },\n      \"targets\": [\n        { \"expr\": \"vector(58)\", \"legendFormat\": \"\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Transacoes Perdidas (RTO window)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 5, \"x\": 19, \"y\": 1 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Estimativa de transacoes que FALHAM durante os 58s de failover. Formula: throughput_medio * RTO. Estas transacoes sao irrecuperaveis — o cliente recebe timeout/connection refused e nao ha fila intermediaria.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"mappings\": [\n            { \"type\": \"range\", \"options\": { \"from\": 0, \"to\": 0.5, \"result\": { \"text\": \"~4 transacoes (58s)\", \"color\": \"yellow\" } } },\n            { \"type\": \"range\", \"options\": { \"from\": 0.5, \"to\": 999, \"result\": { \"text\": \"~4 transacoes (58s)\", \"color\": \"orange\" } } }\n          ],\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"yellow\", \"value\": null } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"value\" },\n      \"targets\": [\n        { \"expr\": \"(sum(rate(donation_request_duration_seconds_count[30m])) or vector(0.07)) * 58\", \"legendFormat\": \"\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Disponibilidade dos Servicos ao Longo do Tempo\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 0, \"y\": 5 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Quando cai para 0, servico esta indisponivel. Gap = janela de DR. Com auto-scaling e self-healing, o servico tenta se recuperar antes de acionar DR.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 30, \"lineWidth\": 2, \"showPoints\": \"never\", \"spanNulls\": false },\n          \"mappings\": [\n            { \"type\": \"value\", \"options\": { \"1\": { \"text\": \"UP\" }, \"0\": { \"text\": \"DOWN\" } } }\n          ],\n          \"min\": 0, \"max\": 1.2\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"up{app=\\\"donation-service\\\", namespace=\\\"solidarytech\\\"}\", \"legendFormat\": \"donation-service\", \"refId\": \"A\" },\n        { \"expr\": \"up{app=\\\"ngo-service\\\", namespace=\\\"solidarytech\\\"}\", \"legendFormat\": \"ngo-service\", \"refId\": \"B\" },\n        { \"expr\": \"up{app=\\\"volunteer-service\\\", namespace=\\\"solidarytech\\\"}\", \"legendFormat\": \"volunteer-service\", \"refId\": \"C\" }\n      ]\n    },\n    {\n      \"title\": \"Throughput por Servico (req/s)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 12, \"y\": 5 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Queda brusca no throughput indica inicio de indisponibilidade. Retorno indica recuperacao (scaling, self-healing ou failover DR).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 20, \"lineWidth\": 2, \"showPoints\": \"never\" },\n          \"unit\": \"reqps\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"sum(rate(donation_request_duration_seconds_count[5m]))\", \"legendFormat\": \"Donation\", \"refId\": \"A\" },\n        { \"expr\": \"sum(rate(ngo_request_duration_seconds_count[5m]))\", \"legendFormat\": \"NGO\", \"refId\": \"B\" },\n        { \"expr\": \"sum(rate(volunteer_request_duration_seconds_count[5m]))\", \"legendFormat\": \"Volunteer\", \"refId\": \"C\" }\n      ]\n    },\n    {\n      \"title\": \"Integridade de Dados & Resiliencia\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 12 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Transacoes com Erro (reais)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 6, \"x\": 0, \"y\": 13 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Erros REAIS de processamento (excluindo SQS que e limitacao do Academy). Estas sao transacoes que o usuario tentou mas falharam - diferente de estimativa.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\"\
    : \"green\", \"value\": null }, { \"color\": \"yellow\", \"value\": 1 }, { \"color\": \"red\", \"value\": 10 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"area\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(donation_errors_total{error_type!=\\\"sqs_publish\\\"}) or vector(0)\",\n          \"legendFormat\": \"Erros reais\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Doacoes Processadas com Sucesso\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 6, \"x\": 6, \"y\": 13 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Total de doacoes processadas com sucesso. Dados sao preservados durante failover via sync bidirecional (INSERT ON CONFLICT).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"blue\", \"value\": null } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"area\" },\n      \"targets\": [\n        { \"expr\": \"donation_processed_total or vector(0)\", \"legendFormat\": \"Processadas\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Total Arrecadado (preservado)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 6, \"x\": 12, \"y\": 13 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Valor total arrecadado. Este valor e preservado integralmente durante failover/failback via sync bidirecional de dados entre regioes.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"currencyBRL\",\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"green\", \"value\": null }, { \"color\": \"dark-green\", \"value\": 10000 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"area\" },\n      \"targets\": [\n        { \"expr\": \"donation_amount_brl_total or vector(0)\", \"legendFormat\": \"R$\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Ticket Medio (R$)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 6, \"x\": 18, \"y\": 13 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Valor medio por doacao. Usado para estimar impacto financeiro de indisponibilidade.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"currencyBRL\",\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"blue\", \"value\": null } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\" },\n      \"targets\": [\n        { \"expr\": \"(donation_amount_brl_total / donation_processed_total) or vector(0)\", \"legendFormat\": \"Ticket Medio\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Erros ao Longo do Tempo (transacoes perdidas reais)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 0, \"y\": 18 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Cada barra e uma transacao que um usuario tentou e FALHOU. Isso e perda real, nao estimativa. Erros de SQS sao excluidos pois sao limitacao do Academy, nao perda de doacao.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"bars\", \"fillOpacity\": 60, \"lineWidth\": 1, \"showPoints\": \"never\", \"stacking\": { \"mode\": \"normal\" } },\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        { \