apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: SolidaryTech
        orgId: 1
        folder: SolidaryTech
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
    grafana_dashboard: "1"
data:
  business-donations.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Metricas de Negocio - Doacoes, Moedas e Operacoes (SolidaryTech)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Regiao Ativa",
          "type": "stat",
          "gridPos": { "h": 3, "w": 4, "x": 20, "y": 0 },
          "datasource": "Prometheus",
          "description": "us-east-1 = Producao | us-west-2 = DR",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "text" },
              "mappings": [
                { "type": "value", "options": { "us-east-1": { "text": "PROD", "color": "green" } } },
                { "type": "value", "options": { "us-west-2": { "text": "DR", "color": "orange" } } }
              ]
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value" },
          "targets": [
            { "expr": "topk(1, count by (topology_kubernetes_io_region) (up{namespace=\"solidarytech\"} == 1))", "legendFormat": "{{ topology_kubernetes_io_region }}", "refId": "A" }
          ]
        },
        {
          "title": "Doacoes Processadas (Total)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "orientation": "auto" },
          "targets": [
            { "expr": "donation_processed_total", "legendFormat": "Total", "refId": "A" }
          ]
        },
        {
          "title": "Total Arrecadado (R$)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "currencyBRL",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "dark-green", "value": 10000 } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "orientation": "auto" },
          "targets": [
            { "expr": "donation_amount_brl_total", "legendFormat": "R$", "refId": "A" }
          ]
        },
        {
          "title": "Taxa de Sucesso (%)",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 5, "x": 10, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 90 }, { "color": "green", "value": 98 } ] }
            }
          },
          "targets": [
            {
              "expr": "(\n  sum(donation_processed_total)\n  /\n  (sum(donation_processed_total) + (sum(donation_errors_total{error_type!=\"sqs_publish\"}) or vector(0)) + 1)\n) * 100",
              "legendFormat": "Success Rate",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Erros por Tipo",
          "type": "piechart",
          "gridPos": { "h": 5, "w": 4, "x": 15, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "right" }, "pieType": "donut", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "donation_errors_total", "legendFormat": "{{ error_type }}", "refId": "A" }
          ]
        },
        {
          "title": "Doacoes por Moeda",
          "type": "piechart",
          "gridPos": { "h": 5, "w": 5, "x": 19, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "right" }, "pieType": "donut", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "donation_by_currency_total", "legendFormat": "{{ currency }}", "refId": "A" }
          ]
        },
        {
          "title": "Arrecadacao ao Longo do Tempo (R$)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "dark-green", "mode": "fixed" },
              "custom": { "drawStyle": "line", "fillOpacity": 30, "lineWidth": 2, "showPoints": "never" },
              "unit": "currencyBRL"
            }
          },
          "targets": [
            { "expr": "donation_amount_brl_total", "legendFormat": "Total Acumulado (R$)", "refId": "A" }
          ]
        },
        {
          "title": "Volume de Doacoes ao Longo do Tempo",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "green", "mode": "fixed" },
              "custom": { "drawStyle": "bars", "fillOpacity": 60, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            }
          },
          "targets": [
            { "expr": "increase(donation_processed_total[5m])", "legendFormat": "Doacoes (5min)", "refId": "A" }
          ]
        },
        {
          "title": "Doacoes por Moeda ao Longo do Tempo",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 30, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } },
              "unit": "short"
            }
          },
          "targets": [
            { "expr": "increase(donation_by_currency_total[5m])", "legendFormat": "{{ currency }}", "refId": "A" }
          ]
        },
        {
          "title": "Latencia de Processamento de Doacao",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "thresholdsStyle": { "mode": "line+area" } },
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "transparent", "value": null }, { "color": "red", "value": 0.5 } ] }
            }
          },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(donation_slo_latency_seconds_bucket[5m])) by (le))", "legendFormat": "P50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(donation_slo_latency_seconds_bucket[5m])) by (le))", "legendFormat": "P95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(donation_slo_latency_seconds_bucket[5m])) by (le))", "legendFormat": "P99", "refId": "C" }
          ]
        },
        {
          "title": "Erros ao Longo do Tempo (por tipo)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 21 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "fillOpacity": 50, "lineWidth": 1, "showPoints": "never", "stacking": { "mode": "normal" } },
              "unit": "short"
            }
          },
          "targets": [
            { "expr": "increase(donation_errors_total[5m])", "legendFormat": "{{ error_type }}", "refId": "A" }
          ]
        },
        {
          "title": "Operacoes NGO Service",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 21 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" },
              "unit": "ops"
            }
          },
          "targets": [
            { "expr": "rate(ngo_operations_total[5m])", "legendFormat": "{{ operation }}", "refId": "A" }
          ]
        },
        {
          "title": "Operacoes Volunteer Service",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 21 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" },
              "unit": "ops"
            }
          },
          "targets": [
            { "expr": "rate(volunteer_operations_total[5m])", "legendFormat": "{{ operation }}", "refId": "A" }
          ]
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["solidarytech", "business", "donations"],
      "templating": { "list": [] },
      "time": { "from": "now-3h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Business Metrics - Doacoes e Operacoes",
      "uid": "solidarytech-business-metrics",
      "version": 1
    }
  infrastructure-cluster.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Infraestrutura e Cluster EKS (SolidaryTech)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Regiao Ativa",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": "Prometheus",
          "description": "us-east-1 = Producao | us-west-2 = DR",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "text" },
              "mappings": [
                { "type": "value", "options": { "us-east-1": { "text": "PROD", "color": "green" } } },
                { "type": "value", "options": { "us-west-2": { "text": "DR", "color": "orange" } } }
              ]
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value" },
          "targets": [
            { "expr": "topk(1, count by (topology_kubernetes_io_region) (up{namespace=\"solidarytech\"} == 1))", "legendFormat": "{{ topology_kubernetes_io_region }}", "refId": "A" }
          ]
        },
        {
          "title": "Nodes Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [
            { "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"} == 1)", "legendFormat": "Ready", "refId": "A" }
          ]
        },
        {
          "title": "Total Pods (cluster)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [
            { "expr": "count(kube_pod_info)", "legendFormat": "Pods", "refId": "A" }
          ]
        },
        {
          "title": "Namespaces Ativos",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [
            { "expr": "count(kube_namespace_status_phase{phase=\"Active\"})", "legendFormat": "Active", "refId": "A" }
          ]
        },
        {
          "title": "CPU Cluster (%)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[5m])) / sum(machine_cpu_cores)", "legendFormat": "CPU Usage", "refId": "A" }
          ]
        },
        {
          "title": "Memoria Cluster (%)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            { "expr": "sum(container_memory_usage_bytes{id=\"/\"}) / sum(machine_memory_bytes)", "legendFormat": "Memory Usage", "refId": "A" }
          ]
        },
        {
          "title": "Disco Cluster (%)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            { "expr": "sum(container_fs_usage_bytes{device=~\"/dev/.+\",id=\"/\"}) / sum(container_fs_limit_bytes{device=~\"/dev/.+\",id=\"/\"})", "legendFormat": "Disk Usage", "refId": "A" }
          ]
        },
        {
          "title": "CPU por Node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" },
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[5m])) by (instance) / on(instance) machine_cpu_cores", "legendFormat": "{{ instance }}", "refId": "A" }
          ]
        },
        {
          "title": "Memoria por Node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "targets": [
            { "expr": "container_memory_usage_bytes{id=\"/\"}", "legendFormat": "Usado {{ instance }}", "refId": "A" },
            { "expr": "machine_memory_bytes", "legendFormat": "Total {{ instance }}", "refId": "B" }
          ]
        },
        {
          "title": "Pods por Namespace",
          "type": "bargauge",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 12 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [
            { "expr": "count(kube_pod_info) by (namespace)", "legendFormat": "{{ namespace }}", "refId": "A", "instant": true }
          ]
        },
        {
          "title": "Container Restarts por Namespace",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 12 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "fillOpacity": 50, "lineWidth": 1, "showPoints": "never", "stacking": { "mode": "normal" } },
              "unit": "short"
            }
          },
          "targets": [
            { "expr": "increase(kube_pod_container_status_restarts_total[10m])", "legendFormat": "{{ namespace }}/{{ pod }}", "refId": "A" }
          ]
        },
        {
          "title": "Network I/O por Pod (solidarytech)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 12 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 1, "showPoints": "never" },
              "unit": "Bps"
            }
          },
          "targets": [
            { "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"solidarytech\"}[5m])) by (pod)", "legendFormat": "RX {{ pod }}", "refId": "A" },
            { "expr": "-sum(rate(container_network_transmit_bytes_total{namespace=\"solidarytech\"}[5m])) by (pod)", "legendFormat": "TX {{ pod }}", "refId": "B" }
          ]
        },
        {
          "title": "HPA Status - Replicas Atuais",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 18 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "short"
            }
          },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"solidarytech\"}", "legendFormat": "{{ horizontalpodautoscaler }} current", "refId": "A" },
            { "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"solidarytech\"}", "legendFormat": "{{ horizontalpodautoscaler }} max", "refId": "B" }
          ]
        },
        {
          "title": "PodDisruptionBudget Status",
          "type": "table",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 18 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [ { "id": "custom.cellOptions", "value": { "type": "color-background" } } ]
              }
            ]
          },
          "targets": [
            { "expr": "kube_poddisruptionbudget_status_current_healthy{namespace=\"solidarytech\"}", "legendFormat": "{{ poddisruptionbudget }} healthy", "refId": "A", "instant": true },
            { "expr": "kube_poddisruptionbudget_status_desired_healthy{namespace=\"solidarytech\"}", "legendFormat": "{{ poddisruptionbudget }} desired", "refId": "B", "instant": true }
          ],
          "transformations": [ { "id": "merge", "options": {} } ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["solidarytech", "infrastructure", "cluster", "eks"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Infrastructure & Cluster - EKS",
      "uid": "solidarytech-infrastructure",
      "version": 1
    }
  platform-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Visao Executiva - Todos os Microsservicos (SolidaryTech)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [
