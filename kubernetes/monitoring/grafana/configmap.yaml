  sre-golden-metrics.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": \"-- Grafana --\",\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"SRE Golden Metrics - Donation Service (SolidaryTech)\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"panels\": [\n    {\n      \"title\": \"Request Rate (Throughput)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"req/s\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 15,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(donation_request_duration_seconds_count[5m]))\",\n          \"legendFormat\": \"Total Request Rate\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"sum(rate(donation_request_duration_seconds_count[5m])) by (method)\",\n          \"legendFormat\": \"{{ method }}\",\n          \"refId\": \"B\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Error Rate (%)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 0 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"fixedColor\": \"red\", \"mode\": \"fixed\" },\n          \"custom\": {\n            \"axisLabel