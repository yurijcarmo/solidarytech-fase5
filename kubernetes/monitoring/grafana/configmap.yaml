"\
    gridPos\": { \"h\": 7, \"w\": 12, \"x\": 0, \"y\": 32 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Gap entre desired e ready indica: scaling em progresso, pod reiniciando, ou migracao DR. Desired subindo = HPA ativou scaling. Ready caindo = pods morrendo.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 15, \"lineWidth\": 2, \"showPoints\": \"never\" },\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"sum(kube_deployment_spec_replicas{namespace=\\\"solidarytech\\\"})\", \"legendFormat\": \"Desired\", \"refId\": \"A\" },\n        { \"expr\": \"sum(kube_deployment_status_replicas_ready{namespace=\\\"solidarytech\\\"})\", \"legendFormat\": \"Ready\", \"refId\": \"B\" },\n        { \"expr\": \"sum(kube_deployment_spec_replicas{namespace=\\\"solidarytech\\\"}) - sum(kube_deployment_status_replicas_ready{namespace=\\\"solidarytech\\\"})\", \"legendFormat\": \"Gap (scaling/migrating)\", \"refId\": \"C\" }\n      ]\n    },\n    {\n      \"title\": \"Restarts por Pod\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 12, \"y\": 32 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Restarts indicam self-healing atuando. Kubernetes reinicia automaticamente pods que falham no liveness probe antes de precisar acionar DR.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"bars\", \"fillOpacity\": 60, \"lineWidth\": 1, \"showPoints\": \"never\" },\n          \"unit\": \"short\"\n        }\n      },\n      \"targets\": [\n        { \"expr\": \"increase(kube_pod_container_status_restarts_total{namespace=\\\"solidarytech\\\"}[5m])\", \"legendFormat\": \"{{ pod }}\", \"refId\": \"A\" }\n      ]\n    },\n    {\n      \"title\": \"Aler