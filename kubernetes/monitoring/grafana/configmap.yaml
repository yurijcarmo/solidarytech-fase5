dFormat\": \"P95\",\n          \"refId\": \"B\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.99, sum(rate(donation_request_duration_seconds_bucket[5m])) by (le))\",\n          \"legendFormat\": \"P99\",\n          \"refId\": \"C\"\n        }\n      ]\n    },\n    {\n      \"title\": \"SLO Compliance - Availability (Target: 99.9%)\",\n      \"type\": \"gauge\",\n      \"gridPos\": { \"h\": 8, \"w\": 6, \"x\": 12, \"y\": 8 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"percentunit\",\n          \"min\": 0.99,\n          \"max\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"orange\", \"value\": 0.995 },\n              { \"color\": \"yellow\", \"value\": 0.999 },\n              { \"color\": \"green\", \"value\": 0.9995 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"1 - (\\n  sum(rate(donation_errors_total[30m]))\\n  /\\n  sum(rate(donation_request_duration_seconds_count[30m]))\\n)\",\n          \"legendFormat\": \"Availability\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Error Budget Remaining (%)\",\n      \"type\": \"gauge\",\n      \"gridPos\": { \"h\": 8, \"w\": 6, \"x\": 18, \"y\": 8 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"orange\", \"value\": 25 },\n              { \"color\": \"yellow\", \"value\": 50 },\n              { \"color\": \"green\", \"value\": 75 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"clamp_min(\\n  (\\n    1 - (\\n      (\\n        sum(rate(donation_errors_total[24h]))\\n        /\\n        sum(rate(donation_request_duration_seconds_count[24h]))\\n      )\\n      / 0.001\\n    )\\n  ) * 100,\\n  0\\n)\",\n          \"legendFormat\": \"Error Budget Remaining\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Pod Restarts (last 1h)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 12, \"x\": 0, \"y\": 16 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"short\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 1 },\n              { \"color\": \"orange\", \"value\": 3 },\n              { \"color\": \"red\", \"value\": 5 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(increase(kube_pod_container_status_restarts_total{namespace=\\\"solidarytech\\\"}[1h]))\",\n          \"legendFormat\": \"Total Restarts\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Active Pods per Service\",\n      \"type\": \"bargauge\",\n      \"gridPos\": { \"h\": 4, \"w\": 12, \"x\": 12, \"y\": 16 },\n      \"datasource\": \"Prometheus\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"green\", \"value\": 2 }\n      