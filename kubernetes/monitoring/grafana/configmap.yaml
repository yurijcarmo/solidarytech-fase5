yellow\", \"value\": 500 }, { \"color\": \"red\", \"value\": 5000 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\" },\n      \"targets\": [\n        {\n          \"expr\": \"clamp_min(\\n  (sum(donation_errors_total{error_type!=\\\"sqs_publish\\\"}) or vector(0))\\n  * ((donation_amount_brl_total / donation_processed_total) or vector(0)),\\n  0\\n)\",\n          \"legendFormat\": \"Perda por erros\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Perda por RTO Window (R$)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 4, \"x\": 4, \"y\": 26 },\n      \"datasource\": \"Prometheus\",\n      \"description\": \"Estimativa de perda durante os 58s de failover. Formula: throughput_medio * RTO_segundos * ticket_medio. Estas transacoes sao irrecuperaveis — cliente recebeu timeout.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"unit\": \"currencyBRL\",\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [ { \"color\": \"green\", \"value\": null }, { \"color\": \"yellow\", \"value\": 1000 }, { \"color\": \"red\", \"value\": 10000 } ] }\n        }\n      },\n      \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] }, \"colorMode\": \"background\", \"graphMode\": \"none\" },\n      \"targets\": [\n        {\n          \"expr\": \"clamp_min(\\n  (sum(rate(donation_request_duration_seconds_count[30m])) or vector(0.07))\\n  * 58\\n  * ((donation_amount_brl_total / donation_processed_total) or vector(200)),\\n  0\\n)\",\n          \"legendFormat\": \"Perda por RTO\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Downtime (ultima 1h)\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 5, \"w\": 8, \"x\": 8, \"y\": 26 },\n      \"datasource\": \"Prometheus\",\n      \"description\":