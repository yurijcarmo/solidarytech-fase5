apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donation-worker-hpa
  namespace: solidarytech
  labels:
    app: donation-service
    component: worker
    team: solidarytech
    cost-center: ngo-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donation-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
