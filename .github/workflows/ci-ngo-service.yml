name: CI - Ngo Service

on:
  push:
    branches: [main]
    paths:
      - 'microservices/ngo-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'microservices/ngo-service/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: solidarytech/ngo-service
  SERVICE_NAME: ngo-service

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/ngo-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
      - name: Lint
        run: flake8 src/ --max-line-length=120 --statistics
      - name: Unit tests
        run: pytest tests/ -v --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-ngo-service
          path: microservices/ngo-service/coverage.xml

  security:
    name: DevSecOps scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build scan image
        run: docker build -t ${{ env.SERVICE_NAME }}:scan microservices/ngo-service/
      - name: Trivy report - HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.SERVICE_NAME }}:scan'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
      - name: Trivy quality gate - CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.SERVICE_NAME }}:scan'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
      - name: Trivy SCA - dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: 'microservices/ngo-service/'
          format: table
          exit-code: '1'
          severity: 'CRITICAL'

  build_push:
    name: Build and push immutable image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      registry: ${{ steps.login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        name: Image metadata
        run: echo "image_tag=sha-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: microservices/ngo-service
          push: true
          tags: ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}

  gitops:
    name: Update GitOps manifest
    runs-on: ubuntu-latest
    needs: build_push
    steps:
      - uses: actions/checkout@v4
      - name: Update deployment image
        env:
          IMAGE: ${{ needs.build_push.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build_push.outputs.image_tag }}
        run: |
          sed -i "s#image: .*solidarytech/ngo-service:.*#image: $IMAGE#" kubernetes/base/ngo-service/deployment.yaml
      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/base/ngo-service/
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): deploy ngo-service ${{ needs.build_push.outputs.image_tag }}"
          git push
