name: CI - Donation Service

on:
  push:
    branches: [main]
    paths:
      - 'microservices/donation-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'microservices/donation-service/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: solidarytech/donation-service
  SERVICE_NAME: donation-service

jobs:
  test:
    name: Testes e Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/donation-service
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint com flake8
        run: flake8 src/ --max-line-length=120 --statistics

      - name: Executar testes
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload cobertura
        uses: actions/upload-artifact@v6
        with:
          name: coverage-donation-service
          path: microservices/donation-service/coverage.xml

  security-scan:
    name: Scan de Seguranca (DevSecOps)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build imagem para scan
        run: |
          docker build -t ${{ env.SERVICE_NAME }}:scan \
            microservices/donation-service/

      - name: Trivy - Scan de vulnerabilidades na imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.SERVICE_NAME }}:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.txt'

      - name: Trivy - Scan SCA nas dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'microservices/donation-service/'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Upload resultado Trivy
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-donation-service
          path: trivy-results.txt

  build-push:
    name: Build e Push para ECR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      skipped: ${{ steps.check-creds.outputs.skip }}
    steps:
      - uses: actions/checkout@v6

      - name: Verificar credenciais AWS
        id: check-creds
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::AWS credentials nao configuradas — build-push ignorado. No Academy, use deploy.sh local."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Configurar credenciais AWS
        if: steps.check-creds.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        if: steps.check-creds.outputs.skip == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Metadados da imagem
        if: steps.check-creds.outputs.skip == 'false'
        id: meta
        run: |
          SHA_TAG="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA::8}"
          LATEST_TAG="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "sha_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "full_sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "full_latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Build e push imagem Docker
        if: steps.check-creds.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: microservices/donation-service
          push: true
          tags: |
            ${{ steps.meta.outputs.full_sha_tag }}
            ${{ steps.meta.outputs.full_latest_tag }}

  update-manifests:
    name: Atualizar Manifests (GitOps)
    runs-on: ubuntu-latest
    needs: build-push
    if: needs.build-push.outputs.skipped != 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar tag da imagem no deployment
        run: |
          NEW_TAG="${{ needs.build-push.outputs.image_tag }}"
          sed -i "s|image: .*donation-service:.*|image: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${NEW_TAG}|" \
            kubernetes/base/donation-service/deployment.yaml

      - name: Commit e push das alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/base/donation-service/deployment.yaml
          git diff --staged --quiet || git commit -m "chore(gitops): atualizar donation-service para ${{ needs.build-push.outputs.image_tag }}"
          git push
