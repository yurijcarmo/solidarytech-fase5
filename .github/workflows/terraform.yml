name: Terraform - Validate and Plan

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
      - name: Format
        run: terraform fmt -check -recursive terraform/
      - name: Validate production
        working-directory: terraform/environments/production
        run: |
          terraform init -backend=false
          terraform validate
      - name: Validate DR
        working-directory: terraform/environments/dr
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: Terraform production plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve Academy account and roles
        id: academy
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CLUSTER_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName,'LabEksClusterRole')].RoleName | [0]" --output text 2>/dev/null || true)
          NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName,'LabEksNodeRole')].RoleName | [0]" --output text 2>/dev/null || true)
          [[ -z "$CLUSTER_ROLE" || "$CLUSTER_ROLE" == "None" ]] && CLUSTER_ROLE=LabRole
          [[ -z "$NODE_ROLE" || "$NODE_ROLE" == "None" ]] && NODE_ROLE=LabRole
          echo "state_bucket=solidarytech-terraform-state-$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "cluster_role=$CLUSTER_ROLE" >> "$GITHUB_OUTPUT"
          echo "node_role=$NODE_ROLE" >> "$GITHUB_OUTPUT"
      - name: Init
        working-directory: terraform/environments/production
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.academy.outputs.state_bucket }}" \
            -backend-config="key=environments/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
      - name: Plan
        working-directory: terraform/environments/production
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_eks_cluster_role_name: ${{ steps.academy.outputs.cluster_role }}
          TF_VAR_eks_node_role_name: ${{ steps.academy.outputs.node_role }}
        run: terraform plan -no-color | tee plan-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/production/plan-output.txt
