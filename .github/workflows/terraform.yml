name: Terraform - Infraestrutura como Codigo

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/environments/production

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.0

      - name: Verificar formatacao
        run: terraform fmt -check -recursive
        working-directory: terraform/

      - name: Validar modulos (production)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_username: "validate_placeholder"
          TF_VAR_db_password: "validate_placeholder"
          TF_VAR_eks_cluster_role_name: "validate_placeholder"
          TF_VAR_eks_node_role_name: "validate_placeholder"

      - name: Validar modulos (DR)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform/environments/dr
        env:
          TF_VAR_db_username: "validate_placeholder"
          TF_VAR_db_password: "validate_placeholder"
          TF_VAR_eks_cluster_role_name: "validate_placeholder"
          TF_VAR_eks_node_role_name: "validate_placeholder"
          TF_VAR_tf_state_bucket: "validate_placeholder"

  plan:
    name: Plano de Execucao
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Verificar credenciais AWS
        id: check-creds
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Credenciais AWS nao configuradas. No AWS Academy, as credenciais expiram a cada 4h — configure em Settings > Secrets antes de executar."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Setup Terraform
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.0

      - name: Configurar credenciais AWS
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializar Terraform
        if: steps.check-creds.outputs.has_creds == 'true'
        id: tf-init
        run: |
          if ! terraform init -no-color 2>&1 | tee init-output.txt; then
            echo "::warning::Backend S3 indisponivel — usando -backend=false (validacao local)"
            terraform init -backend=false -no-color
            echo "backend=false" >> $GITHUB_OUTPUT
          else
            echo "backend=true" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Gerar plano
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          if [ "${{ steps.tf-init.outputs.backend }}" = "true" ]; then
            terraform plan -out=tfplan -no-color 2>&1 | tee plan-output.txt
          else
            echo "Plan ignorado — backend S3 indisponivel (AWS Academy). Validacao local concluida com sucesso." | tee plan-output.txt
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_eks_cluster_role_name: ${{ secrets.EKS_CLUSTER_ROLE_NAME }}
          TF_VAR_eks_node_role_name: ${{ secrets.EKS_NODE_ROLE_NAME }}

      - name: Upload plano
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan-output.txt

      - name: Comentar PR com plano
        if: github.event_name == 'pull_request' && steps.check-creds.outputs.has_creds == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\n\`\`\`\n${truncated}\n\`\`\``
            });

  apply:
    name: Aplicar Terraform
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Verificar credenciais AWS
        id: check-creds
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Credenciais AWS nao configuradas. No AWS Academy, as credenciais expiram a cada 4h — configure em Settings > Secrets antes de executar."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Setup Terraform
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.0

      - name: Configurar credenciais AWS
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializar Terraform
        if: steps.check-creds.outputs.has_creds == 'true'
        id: tf-init-apply
        run: |
          if ! terraform init -no-color 2>&1 | tee init-output.txt; then
            echo "::warning::Backend S3 indisponivel — apply ignorado (AWS Academy)"
            echo "backend=false" >> $GITHUB_OUTPUT
          else
            echo "backend=true" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Aplicar infraestrutura
        if: steps.check-creds.outputs.has_creds == 'true' && steps.tf-init-apply.outputs.backend == 'true'
        run: terraform apply -auto-approve -no-color 2>&1 | tee apply-output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_eks_cluster_role_name: ${{ secrets.EKS_CLUSTER_ROLE_NAME }}
          TF_VAR_eks_node_role_name: ${{ secrets.EKS_NODE_ROLE_NAME }}

      - name: Upload resultado do apply
        if: always() && steps.tf-init-apply.outputs.backend == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: terraform-apply
          path: ${{ env.TF_WORKING_DIR }}/apply-output.txt
